name: Run tests
on:
  workflow_call:
    inputs:
      submodules:
        default: true
        required: false
        type: boolean
      runs-on:
        default: ubuntu-26.04-arm
        required: false
        type: string
      os: # JSON array; pass '["ubuntu-26.04-arm", "macos-latest", "windows-latest"]' for a full OS matrix
        default: '["ubuntu-26.04-arm"]'
        required: false
        type: string
      node-only: # Skip node_tsc, bun and deno jobs; use with a full OS matrix
        default: false
        required: false
        type: boolean
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    name: Node v${{ matrix.node }}${{ matrix.os != 'ubuntu-26.04-arm' && format(' @ {0}', matrix.os) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        node: [22, 24.15, 26] # LTS
        os: ${{ fromJSON(inputs.os || '["ubuntu-26.04-arm"]') }} # Fallback for workflow_dispatch, where input defaults don't apply
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules }}
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts # Block install-time scripts of dependencies
      - run: npm run build --if-present
      - run: npm test
      - run: npm run test:check --if-present
  node_tsc:
    name: Node v${{ matrix.node }} (compiled)
    if: ${{ !inputs.node-only }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    strategy:
      matrix:
        node: [26] # May 2026 LTS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules }}
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts # Block install-time scripts of dependencies
      - run: npm run build --if-present
      - name: Detect package.json scripts
        id: scripts
        run: |
          grep -q '"test:tsc"' package.json && echo "tsc=1" >> "$GITHUB_OUTPUT" || true
          [ -f test/tsconfig.json ] && echo "tsconfig=1" >> "$GITHUB_OUTPUT" || true
      - name: Run test:tsc
        if: steps.scripts.outputs.tsc
        run: npm run test:tsc
      - name: Run test (tsc, derived from test/tsconfig.json)
        if: ${{ !steps.scripts.outputs.tsc && steps.scripts.outputs.tsconfig }}
        run: cd test && npx tsc && node compiled/test/index.js
  bun:
    name: Bun
    if: ${{ !inputs.node-only }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Detect package.json scripts
        id: scripts
        run: |
          grep -q '"test:bun"' package.json && echo "bun=1" >> "$GITHUB_OUTPUT" || true
          echo "test_file=$(node -e "const s=(require('./package.json').scripts||{}).test||''; const m=s.match(/^node\s+(.+)$/); console.log(m?m[1]:'')")" >> "$GITHUB_OUTPUT"
      - run: bun install
      - run: bun run --if-present build
      - name: Run test:bun
        if: steps.scripts.outputs.bun
        run: bun run test:bun
      - name: Run test (bun, derived from "test" script)
        if: ${{ !steps.scripts.outputs.bun && steps.scripts.outputs.test_file }}
        run: bun ${{ steps.scripts.outputs.test_file }}
  deno:
    name: Deno
    if: ${{ !inputs.node-only }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: lts
      - name: Detect package.json scripts
        id: scripts
        run: |
          grep -q '"test:deno"' package.json && echo "deno=1" >> "$GITHUB_OUTPUT" || true
          grep -q '"build"' package.json && echo "build=1" >> "$GITHUB_OUTPUT" || true
          echo "test_file=$(node -e "const s=(require('./package.json').scripts||{}).test||''; const m=s.match(/^node\s+(.+)$/); console.log(m?m[1]:'')")" >> "$GITHUB_OUTPUT"
      - run: deno install
      - name: Run build
        if: steps.scripts.outputs.build
        run: deno task build
      - name: Run test:deno
        if: steps.scripts.outputs.deno
        run: deno task test:deno
      - name: Run test (deno, derived from "test" script)
        if: ${{ !steps.scripts.outputs.deno && steps.scripts.outputs.test_file }}
        run: deno --allow-env --allow-read ${{ steps.scripts.outputs.test_file }}