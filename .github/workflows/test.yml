name: Run tests
on:
  workflow_call:
    inputs:
      submodules:
        default: true
        required: false
        type: boolean
      runs-on:
        default: ubuntu-26.04-arm
        required: false
        type: string
  workflow_dispatch:
jobs:
  node:
    name: Node v${{ matrix.node }}
    runs-on: ${{ inputs.runs-on }}
    strategy:
      matrix:
        node: [22, 24, 26] # LTS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules }}
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          registry-url: "https://registry.npmjs.org"
          cache: npm
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run build --if-present
      - run: npm test
      - run: npm run test:check --if-present
  node_tsc:
    name: Node v${{ matrix.node }} (compiled)
    runs-on: ${{ inputs.runs-on }}
    strategy:
      matrix:
        node: [26] # May 2026 LTS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules }}
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          registry-url: "https://registry.npmjs.org"
          cache: npm
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run build --if-present
      - run: npm run test:tsc --if-present
  bun:
    name: Bun
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install
      - run: bun run --if-present build
      - run: bun run --if-present test:bun
  deno:
    name: Deno
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: lts
      - run: grep -q 'test:deno' package.json && deno install || exit 0
        name: Run deno install if test:deno is present
      - run: grep -q 'build' package.json && deno task build || exit 0
        name: Run build if present
      - run: grep -q 'test:deno' package.json && deno task test:deno || exit 0
        name: Run test:deno if present
