name: Run tests
on:
  workflow_call:
    inputs:
      submodules:
        default: false
        required: false
        type: boolean
  workflow_dispatch:
jobs:
  node:
    name: Node v${{ matrix.node }} @ ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      MSHOULD_FAST: 1
    strategy:
      matrix:
        node: [22, 24.15, 26] # May 2026 LTS
        os: [ubuntu-26.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules }}
      - name: Use Node.js ${{ matrix.node }} @ ${{ matrix.os }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          registry-url: "https://registry.npmjs.org"
          cache: npm
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run build --if-present
      - run: npm test
      - run: npm run test:check --if-present
